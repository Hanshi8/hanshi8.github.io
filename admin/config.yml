# Decap CMS 配置
# 访问 https://hanshi8.github.io/admin 即可在网页上管理文章

backend:
  name: turbo-github
  turbo_site_id: d38cb93a-65b7-4a7b-8d01-5618f323a5d6
  branch: main

# 图片等媒体文件的上传位置
media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

# 本地开发时可配合 npx decap-server 使用
# local_backend: true

collections:
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "_posts"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "摘要描述", name: "description", widget: "text", required: false }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "分类", name: "categories", widget: "list", required: false }
      - { label: "置顶", name: "pin", widget: "boolean", default: false, required: false }
      - { label: "显示目录", name: "toc", widget: "boolean", default: true, required: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "files"
    label: "仓库"
    label_singular: "文件"
    folder: "files"
    create: true
    delete: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "正文", name: "body", widget: "markdown" }
