<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内容管理</title>
  <!-- Include the styles for the CMS -->
  <link href="https://cdn.jsdelivr.net/npm/decap-cms@beta/dist/decap-cms.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f8fafc; }
    /* Top navigation */
    #dash-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      z-index: 2147483647;
      background: #0f172a;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 4px;
      box-shadow: 0 1px 8px rgba(0, 0, 0, 0.25);
    }
    #dash-nav .brand {
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      margin-right: 18px;
      white-space: nowrap;
    }
    #dash-nav .brand em { color: #60a5fa; font-style: normal; }
    #dash-nav button {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    #dash-nav button:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
    #dash-nav button.active { background: #2563eb; color: #fff; }
    /* Decap CMS container (created by decap-cms.js) */
    #nc-root {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      z-index: 10;
    }
    /* Other tabs */
    .dash-tab {
      display: none;
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      z-index: 10;
      background: #fff;
    }
    .dash-tab.active { display: block; }
    .dash-tab iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <nav id="dash-nav">
    <span class="brand">寒食 <em>·</em> 管理</span>
    <button id="tab-cms" type="button" class="active">内容管理</button>
    <button id="tab-repo" type="button">仓库</button>
    <button id="tab-stats" type="button">统计</button>
  </nav>

  <!-- Decap CMS renders into #nc-root -->
  <div id="nc-root"></div>

  <div id="tab-repo-panel" class="dash-tab">
    <iframe src="/repository/" title="仓库文件" referrerpolicy="no-referrer"></iframe>
  </div>
  <div id="tab-stats-panel" class="dash-tab">
    <iframe src="https://cloud.umami.is/analytics/eu/share/zQEcudM7nlym0l6b" title="访问统计" referrerpolicy="no-referrer" loading="lazy"></iframe>
  </div>

  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@beta/dist/decap-cms.js"></script>

  <script>
    (function () {
      var cmsBtn = document.getElementById('tab-cms');
      var repoBtn = document.getElementById('tab-repo');
      var statsBtn = document.getElementById('tab-stats');
      var ncRoot = document.getElementById('nc-root');
      var repoPanel = document.getElementById('tab-repo-panel');
      var statsPanel = document.getElementById('tab-stats-panel');

      function showTab(which) {
        cmsBtn.classList.toggle('active', which === 'cms');
        repoBtn.classList.toggle('active', which === 'repo');
        statsBtn.classList.toggle('active', which === 'stats');
        ncRoot.style.display = which === 'cms' ? 'block' : 'none';
        repoPanel.classList.toggle('active', which === 'repo');
        statsPanel.classList.toggle('active', which === 'stats');
        if (which === 'repo') {
          var f = repoPanel.querySelector('iframe');
          var src = f.getAttribute('src');
          f.src = src; // reload to refresh the file list
        }
        if (which === 'stats') {
          var fs = statsPanel.querySelector('iframe');
          var srcs = fs.getAttribute('src');
          fs.src = srcs; // reload to refresh stats
        }
      }

      cmsBtn.addEventListener('click', function () { showTab('cms'); });
      repoBtn.addEventListener('click', function () { showTab('repo'); });
      statsBtn.addEventListener('click', function () { showTab('stats'); });
    })();
  </script>
</body>
</html>
